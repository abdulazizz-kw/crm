<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Schedule · Purple CRM</title>
    <script src="assets/crm/theme.js"></script>
    <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/crm/crm.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" />
  </head>
  <body>
    <div class="container-scroller">
      <div id="crm-navbar"></div>
      <div class="container-fluid page-body-wrapper">
        <div id="crm-sidebar"></div>
        <div class="main-panel">
          <div class="content-wrapper">
            <div class="page-header">
              <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white me-2"><i class="mdi mdi-calendar-month-outline"></i></span> Schedule
              </h3>
              <div class="crm-actions">
                <button class="btn btn-gradient-primary" id="add-event"><i class="mdi mdi-plus"></i> Add to schedule</button>
              </div>
            </div>
            <div class="row">
              <div class="col-xl-9 grid-margin">
                <div class="card">
                  <div class="card-body">
                    <div class="crm-filters mb-3">
                      <div class="btn-group">
                        <button class="btn btn-light" id="prev" aria-label="Previous week"><i class="mdi mdi-chevron-left"></i></button>
                        <button class="btn btn-light" id="today">Today</button>
                        <button class="btn btn-light" id="next" aria-label="Next week"><i class="mdi mdi-chevron-right"></i></button>
                      </div>
                      <h5 class="mb-0 ms-2" id="range"></h5>
                      <select class="form-select ms-auto" id="f-member"><option value="">Whole team</option></select>
                    </div>
                    <div class="crm-week-wrap"><div class="crm-week" id="week"></div></div>
                    <p class="crm-muted crm-small mt-3 mb-0">Click an empty slot to book something, or click an item to edit it.</p>
                  </div>
                </div>
              </div>
              <div class="col-xl-3 grid-margin">
                <div class="card mb-4">
                  <div class="card-body">
                    <h4 class="card-title">Coming up</h4>
                    <div id="agenda"></div>
                  </div>
                </div>
                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">This week</h4>
                    <div id="week-stats"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div id="crm-footer"></div>
        </div>
      </div>
    </div>
    <script src="assets/crm/data.js"></script>
    <script src="assets/crm/ui.js"></script>
    <script src="assets/vendors/js/vendor.bundle.base.js"></script>
    <script src="assets/js/off-canvas.js"></script>
    <script src="assets/js/hoverable-collapse.js"></script>
    <script src="assets/js/misc.js"></script>
    <script src="assets/crm/pages/schedule.js"></script>
  </body>
</html>
