<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Create account · Purple CRM</title>
    <script src="assets/crm/theme.js"></script>
    <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/crm/crm.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" />
  </head>
  <body class="crm-auth">
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 col-md-7 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo"><span class="crm-brand"><img src="assets/images/logo-mini.svg" alt=""><span>Purple CRM</span></span></div>
                <h4>Start your CRM</h4>
                <h6 class="font-weight-light">Set up a workspace for your business in seconds.</h6>
                <form class="pt-3" id="auth-form">
                  <div class="form-group"><input class="form-control form-control-lg" name="name" placeholder="Your name" autocomplete="name" required></div>
                  <div class="form-group"><input type="email" class="form-control form-control-lg" name="email" placeholder="Email" autocomplete="email" required></div>
                  <div class="form-group"><input class="form-control form-control-lg" name="business" placeholder="Business name" required></div>
                  <div class="form-group">
                    <select class="form-select form-select-lg" name="currency" aria-label="Currency">
                      <option>KWD</option><option>SAR</option><option>AED</option><option>QAR</option><option>BHD</option><option>OMR</option><option>USD</option><option>EUR</option><option>GBP</option>
                    </select>
                  </div>
                  <div class="form-group"><input type="password" class="form-control form-control-lg" name="password" placeholder="Password" autocomplete="new-password" minlength="6" required></div>
                  <div class="mt-3 d-grid"><button class="btn btn-gradient-primary btn-lg font-weight-medium auth-form-btn">CREATE WORKSPACE</button></div>
                  <div class="text-center mt-4 font-weight-light">Already have an account? <a href="login.html" class="text-primary">Sign in</a></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/crm/data.js"></script>
    <script>
      document.getElementById("auth-form").addEventListener("submit", function (e) {
        e.preventDefault();
        if (!this.checkValidity()) {
          this.reportValidity();
          return;
        }
        var d = new FormData(this);
        CRM.createWorkspace(String(d.get("business")).trim(), { name: String(d.get("name")).trim(), email: String(d.get("email")).trim() });
        CRM.updateWorkspace({ currency: d.get("currency") });
        location.href = "index.html";
      });
    </script>
  </body>
</html>
