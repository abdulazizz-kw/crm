<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sign in · Purple CRM</title>
    <script src="assets/crm/theme.js"></script>
    <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/crm/crm.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" />
  </head>
  <body class="crm-auth">
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 col-md-7 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo"><span class="crm-brand"><img src="assets/images/logo-mini.svg" alt=""><span>Purple CRM</span></span></div>
                <h4>Welcome back</h4>
                <h6 class="font-weight-light">Sign in to continue.</h6>
                <form class="pt-3" id="auth-form">
                  <div class="form-group">
                    <input type="email" class="form-control form-control-lg" name="email" placeholder="Email" autocomplete="username" required>
                  </div>
                  <div class="form-group">
                    <input type="password" class="form-control form-control-lg" name="password" placeholder="Password" autocomplete="current-password" required>
                  </div>
                  <div class="mt-3 d-grid">
                    <button class="btn btn-gradient-primary btn-lg font-weight-medium auth-form-btn">SIGN IN</button>
                  </div>
                  <p class="crm-muted crm-small mt-3 mb-0"><i class="mdi mdi-information-outline"></i> Demo mode: any email and password opens the CRM. Real accounts come with the database step.</p>
                  <div class="text-center mt-4 font-weight-light">Don't have an account? <a href="register.html" class="text-primary">Create one</a></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/crm/data.js"></script>
    <script>
      document.getElementById("auth-form").addEventListener("submit", function (e) {
        e.preventDefault();
        if (this.checkValidity()) location.href = "index.html";
      });
    </script>
  </body>
</html>
