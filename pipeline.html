<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pipeline · Purple CRM</title>
    <script src="assets/crm/theme.js"></script>
    <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/crm/crm.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" />
  </head>
  <body>
    <div class="container-scroller">
      <div id="crm-navbar"></div>
      <div class="container-fluid page-body-wrapper">
        <div id="crm-sidebar"></div>
        <div class="main-panel">
          <div class="content-wrapper">
            <div class="page-header">
              <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white me-2"><i class="mdi mdi-view-column"></i></span> Pipeline
                <small class="crm-muted crm-small ms-2" id="pipe-total"></small>
              </h3>
              <div class="crm-actions">
                <button class="btn btn-gradient-primary" data-crm-new-deal><i class="mdi mdi-plus"></i> New deal</button>
              </div>
            </div>
            <div class="card mb-4">
              <div class="card-body py-3">
                <div class="crm-filters">
                  <input class="form-control" id="f-text" type="search" placeholder="Filter by deal or customer">
                  <select class="form-select" id="f-owner"><option value="">Everyone's deals</option></select>
                  <div class="crm-seg" id="f-view">
                    <button data-v="all" class="active">All deals</button>
                    <button data-v="attention">Needs attention</button>
                  </div>
                  <span class="crm-muted crm-small ms-auto d-none d-md-inline"><i class="mdi mdi-drag"></i> Drag cards between stages</span>
                </div>
              </div>
            </div>
            <div class="crm-board" id="board"></div>
          </div>
          <div id="crm-footer"></div>
        </div>
      </div>
    </div>
    <script src="assets/crm/data.js"></script>
    <script src="assets/crm/ui.js"></script>
    <script src="assets/vendors/js/vendor.bundle.base.js"></script>
    <script src="assets/vendors/sortable/Sortable.min.js"></script>
    <script src="assets/js/off-canvas.js"></script>
    <script src="assets/js/hoverable-collapse.js"></script>
    <script src="assets/js/misc.js"></script>
    <script src="assets/crm/pages/pipeline.js"></script>
  </body>
</html>
