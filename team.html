<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Team · Purple CRM</title>
    <script src="assets/crm/theme.js"></script>
    <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/crm/crm.css">
    <link rel="shortcut icon" href="assets/images/favicon.ico" />
  </head>
  <body>
    <div class="container-scroller">
      <div id="crm-navbar"></div>
      <div class="container-fluid page-body-wrapper">
        <div id="crm-sidebar"></div>
        <div class="main-panel">
          <div class="content-wrapper">
            <div class="page-header">
              <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white me-2"><i class="mdi mdi-account-star"></i></span> Team
              </h3>
              <div class="crm-actions">
                <button class="btn btn-gradient-primary" id="add-member"><i class="mdi mdi-account-plus"></i> Add teammate</button>
              </div>
            </div>
            <div class="row" id="members"></div>
            <div class="card">
              <div class="card-body">
                <h4 class="card-title">Won in the last 90 days</h4>
                <div style="height:280px"><canvas id="team-chart" role="img" aria-label="Revenue won this quarter by teammate"></canvas></div>
              </div>
            </div>
          </div>
          <div id="crm-footer"></div>
        </div>
      </div>
    </div>
    <script src="assets/crm/data.js"></script>
    <script src="assets/crm/ui.js"></script>
    <script src="assets/vendors/js/vendor.bundle.base.js"></script>
    <script src="assets/vendors/chart.js/Chart.min.js"></script>
    <script src="assets/js/off-canvas.js"></script>
    <script src="assets/js/hoverable-collapse.js"></script>
    <script src="assets/js/misc.js"></script>
    <script src="assets/crm/pages/team.js"></script>
  </body>
</html>
